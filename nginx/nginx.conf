# =============================================================================
# Sanad nginx — reverse proxy for two subdomains on one Droplet.
#
# Cloudflare handles SSL termination → nginx listens on port 80 only.
# Set Cloudflare SSL/TLS mode to "Full" (not "Flexible") so Cloudflare
# connects to origin on port 80 with HTTP.
# =============================================================================

# ── sanad-api.promatrix.ai ───────────────────────────────────────────────────
# Direct backend access for banks, Postman, Swagger, and external integrations.
server {
    listen 80;
    server_name sanad-api.promatrix.ai api.motabiq.ai;

    # Pass real client IP from Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must outlast the backend's worst-case MOI call, or nginx cuts the
        # upstream connection mid-response and Cloudflare reports a 502
        # "origin_bad_gateway" even though the backend is healthy.
        #
        #   MoiYemenIdConnector is @Retry(maxAttempts=3, waitDuration=500ms)
        #   and each attempt blocks for moi_credentials.read_timeout_ms
        #   (default 30000) → 3 × 30s + 2 × 0.5s = 91s worst case.
        #
        # 120s leaves headroom above that and stays under Cloudflare's own
        # ~100s proxy timeout, so a slow-but-successful verification completes
        # instead of being truncated. Keep this above the retry budget if
        # either the retry count or read_timeout_ms is ever raised.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Biometric payloads — a PNG fingerprint runs ~100–500KB base64.
        client_max_body_size 5M;
    }
}

# ── sanad-portal.promatrix.ai ────────────────────────────────────────────────
# Admin portal (React SPA) + proxied API calls.
# The portal calls relative URLs (/admin/*, /api/*) — nginx proxies those to
# the backend so the browser sees same-origin calls → no CORS needed.
server {
    listen 80;
    server_name sanad-portal.promatrix.ai portal.motabiq.ai;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Backend API calls — proxied so the portal's relative URLs work
    # without CORS (same origin from the browser's perspective).
    location /admin/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 5M;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Verification runs through here too — see the API server block above
        # for why this must exceed the backend's 91s MOI retry budget.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 5M;
    }

    # Tenant-portal API — proxied like /admin so the portal's relative URLs work.
    location /portal-api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 5M;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — everything else serves the static portal
    location / {
        proxy_pass http://portal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
