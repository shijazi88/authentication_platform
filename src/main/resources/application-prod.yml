# =============================================================================
# Profile: prod
# Production environment. Strictest configuration:
#  - All secrets from environment / secrets manager (no defaults).
#  - Bootstrap admin disabled.
#  - No verbose error messages.
#  - Higher pool sizes, longer timeouts where appropriate.
# =============================================================================

spring:
  datasource:
    url: ${DB_URL:?DB_URL must be set in production}
    username: ${DB_USERNAME:?DB_USERNAME must be set in production}
    password: ${DB_PASSWORD:?DB_PASSWORD must be set in production}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000
      max-lifetime: 1800000
  jpa:
    show-sql: false
  flyway:
    # Production migrations should always be reviewed manually before running.
    out-of-order: false
    validate-on-migrate: true

logging:
  level:
    root: WARN
    com.middleware.platform: INFO
    org.springframework.security: WARN

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

platform:
  security:
    jwt:
      secret: ${PLATFORM_SECURITY_JWT_SECRET:?PLATFORM_SECURITY_JWT_SECRET must be set in production}
      issuer: ${PLATFORM_SECURITY_JWT_ISSUER:middleware-platform}
      access-token-ttl-minutes: 30
    bootstrap-admin:
      email: ""
      password: ""
      enabled: false
    # Base64-encoded 32-byte key OR a passphrase (hashed to 32 bytes).
    # Used for AES-GCM encryption of sensitive DB columns (e.g. moi_credentials.password).
    # If unset, columns are stored in plaintext (WARNING logged at startup).
    column-encryption-key: ${PLATFORM_COLUMN_ENCRYPTION_KEY:}

  connectors:
    yemen-id:
      # wiremock: use the mock container for testing
      # moi:      use the live MOI connector (reads creds from moi_credentials DB row)
      mode: ${YEMEN_ID_MODE:wiremock}
      base-url: ${YEMEN_ID_BASE_URL:?YEMEN_ID_BASE_URL must be set in production}
      bearer-token: ${YEMEN_ID_BEARER_TOKEN:?YEMEN_ID_BEARER_TOKEN must be set in production}
      timeout-ms: 10000
      trust-all-certs: ${YEMEN_ID_TRUST_ALL_CERTS:false}

  moi:
    audit:
      # How many days of MOI api-call audit rows to keep before the nightly
      # cleanup deletes them.
      retention-days: ${MOI_AUDIT_RETENTION_DAYS:30}
      cleanup-cron: ${MOI_AUDIT_CLEANUP_CRON:0 0 3 * * *}
